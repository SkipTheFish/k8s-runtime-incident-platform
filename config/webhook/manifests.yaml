---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-observability-io-v1-alertpolicy
  failurePolicy: Fail
  name: malertpolicy.kb.io
  rules:
  - apiGroups:
    - observability.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - alertpolicies
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-observability-io-v1-alertpolicy
  failurePolicy: Fail
  name: valertpolicy.kb.io
  rules:
  - apiGroups:
    - observability.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - alertpolicies
  sideEffects: None
