apiVersion: v1
kind: Namespace
metadata: {name: incident-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: bad-image, namespace: incident-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: bad-image}}
  template:
    metadata: {labels: {app: bad-image}}
    spec:
      containers: [{name: app, image: invalid.example.invalid/demo:missing}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: crash-loop, namespace: incident-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: crash-loop}}
  template:
    metadata: {labels: {app: crash-loop}}
    spec:
      containers: [{name: app, image: busybox:1.37.0, command: [sh, -c, 'echo intentional demo failure; exit 1']}]
---
apiVersion: v1
kind: Pod
metadata: {name: unschedulable, namespace: incident-demo}
spec:
  containers:
    - name: app
      image: busybox:1.37.0
      command: [sh, -c, 'sleep 3600']
      resources: {requests: {cpu: "1000", memory: 1Ti}}
