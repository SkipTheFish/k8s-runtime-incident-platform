{{- if .Values.config.kubernetesEnabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "runtime-incident-platform.fullname" . }}
  labels: {{- include "runtime-incident-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/status, events, nodes, namespaces, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [observability.io]
    resources: [alertpolicies, correlationpolicies, observabilitytargets, observetenants]
    verbs: [get, list, watch]
  - apiGroups: [observability.io]
    resources: [alertpolicies/status, correlationpolicies/status, observabilitytargets/status, observetenants/status]
    verbs: [get, patch, update]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules, servicemonitors]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "runtime-incident-platform.fullname" . }}
  labels: {{- include "runtime-incident-platform.labels" . | nindent 4 }}
subjects:
  - {kind: ServiceAccount, name: {{ include "runtime-incident-platform.serviceAccountName" . }}, namespace: {{ .Release.Namespace }} }
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "runtime-incident-platform.fullname" . }}}
{{- end }}
