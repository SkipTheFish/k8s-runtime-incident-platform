apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runtime-incident-platform.fullname" . }}
  labels: {{- include "runtime-incident-platform.labels" . | nindent 4 }}
data:
  APP_PORT: "8080"
  CLUSTER_ID: {{ .Values.config.clusterId | quote }}
  KUBERNETES_ENABLED: {{ .Values.config.kubernetesEnabled | quote }}
  REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
  PROMETHEUS_URL: {{ .Values.config.prometheusUrl | quote }}
  LOKI_URL: {{ .Values.config.lokiUrl | quote }}
  TEMPO_URL: {{ .Values.config.tempoUrl | quote }}
  WEBHOOK_URL: {{ .Values.webhook.url | quote }}
  WEBHOOK_ALLOWLIST: {{ .Values.webhook.allowlist | quote }}
  WEBHOOK_TARGET_NAME: {{ .Values.webhook.targetName | quote }}
