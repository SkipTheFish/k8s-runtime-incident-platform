apiVersion: v1
kind: Service
metadata:
  name: runtime-incident-platform-backend
  labels: {{- include "runtime-incident-platform.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: {{ include "runtime-incident-platform.name" . }}, app.kubernetes.io/component: backend}
  ports: [{name: http, port: {{ .Values.backend.service.port }}, targetPort: http}, {name: webhook, port: 443, targetPort: webhook}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime-incident-platform.fullname" . }}-frontend
  labels: {{- include "runtime-incident-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector: {app.kubernetes.io/name: {{ include "runtime-incident-platform.name" . }}, app.kubernetes.io/component: frontend}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- with .Values.frontend.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
