{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "runtime-incident-platform.fullname" . }}
  labels: {{- include "runtime-incident-platform.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "runtime-incident-platform.labels" . | nindent 6 }}
  endpoints: [{port: http, path: /metrics, interval: {{ .Values.serviceMonitor.interval }}}]
{{- end }}
