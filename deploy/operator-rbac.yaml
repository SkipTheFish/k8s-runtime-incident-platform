apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-operator
rules:
  - apiGroups: ["observability.io"]
    resources:
      - alertpolicies
      - alertpolicies/status
      - observabilitytargets
      - observabilitytargets/status
      - observetenants
      - observetenants/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - prometheusrules
      - servicemonitors
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources:
      - namespaces
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-operator
subjects:
  - kind: ServiceAccount
    name: observability-operator
    namespace: default
roleRef:
  kind: ClusterRole
  name: observability-operator
  apiGroup: rbac.authorization.k8s.io