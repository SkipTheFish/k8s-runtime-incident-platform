apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: alertpolicies.observability.io
spec:
  group: observability.io
  names:
    kind: AlertPolicy
    plural: alertpolicies
    singular: alertpolicy
  scope: Namespaced
  versions:
    - name: v1
      served: true
      subresources:
        status: {}
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                tenantID:
                  type: string
                policyName:
                  type: string
                query:
                  type: string
                threshold:
                  type: number
                operator:
                  type: string
                duration:
                  type: string