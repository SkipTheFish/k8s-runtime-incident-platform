name: runtime-incident-platform
services:
  postgres:
    image: postgres:15.15-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-runtime_incidents}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.7-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: ["9090:9090"]
  loki:
    image: grafana/loki:3.6.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: ["3100:3100"]
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: ["3200:3200"]
  backend:
    build: {context: .., dockerfile: Dockerfile}
    image: runtime-incident-platform-backend:local
    environment:
      APP_PORT: "8080"
      CLUSTER_ID: compose
      KUBERNETES_ENABLED: "false"
      POSTGRES_DSN: postgres://${POSTGRES_USER:-runtime}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-runtime_incidents}?sslmode=disable
      REDIS_ADDR: redis:6379
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      prometheus: {condition: service_healthy}
      loki: {condition: service_healthy}
      tempo: {condition: service_healthy}
    networks:
      default:
        aliases: [runtime-incident-platform-backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports: ["8080:8080"]
  frontend:
    build: {context: ../runtime-console, dockerfile: Dockerfile}
    image: runtime-incident-platform-frontend:local
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: ["8081:8080"]
volumes:
  postgres-data: {}
  redis-data: {}
  prometheus-data: {}
  loki-data: {}
  tempo-data: {}
