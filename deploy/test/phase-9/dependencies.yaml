apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:15.15-alpine3.22
          env:
            - {name: POSTGRES_USER, value: runtime}
            - {name: POSTGRES_PASSWORD, value: runtime}
            - {name: POSTGRES_DB, value: runtime_incidents}
          readinessProbe: {exec: {command: [pg_isready, -U, runtime]}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
