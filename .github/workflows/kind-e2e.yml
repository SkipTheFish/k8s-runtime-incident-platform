name: kind-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4
      - name: Run three lifecycle scenarios
        shell: pwsh
        run: ./hack/e2e-kind.ps1
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-e2e-diagnostics
          path: deploy/tmp/e2e
          if-no-files-found: ignore
          retention-days: 14
